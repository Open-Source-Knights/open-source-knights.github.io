<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Open-Source Knights</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #121212;
      color: #d9d9d9;
    }

    h1, h2, h3, h4, h5, h6 {
      color: #ffffff;
    }

    .site-header {
      padding: 4rem 1rem 3rem;
      text-align: center;
    }

    .site-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 1.5rem;
    }

    .site-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .site-subtitle {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      color: #b8b8b8;
      margin-bottom: 0;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="container">

      <img
        src="images/templogo.png"
        alt="Open-Source Knights logo"
        class="site-logo"
      >

      <h1 class="site-title">Open-Source Knights</h1>

      <p class="site-subtitle">
         A Streamlined TTRPG for Crafting Bespoke Heroes
      </p>

    </div>
  </header>

</body>
</html>
